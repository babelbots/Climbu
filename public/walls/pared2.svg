<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="p2-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141816" />
      <stop offset="100%" stop-color="#0c0e0d" />
    </linearGradient>

    <!-- Grey Panel Texture -->
    <linearGradient id="p2-grey-panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E979E" />
      <stop offset="50%" stop-color="#7D868D" />
      <stop offset="100%" stop-color="#6F777E" />
    </linearGradient>

    <!-- Top Dark Green Roof Area -->
    <linearGradient id="p2-teal-roof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B6E63" />
      <stop offset="100%" stop-color="#355249" />
    </linearGradient>

    <!-- Crimson Diamond Facets -->
    <linearGradient id="p2-red-facet-top-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A52835" />
      <stop offset="100%" stop-color="#831A24" />
    </linearGradient>
    <linearGradient id="p2-red-facet-top-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B83240" />
      <stop offset="100%" stop-color="#911D28" />
    </linearGradient>
    <linearGradient id="p2-red-facet-bot-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A1822" />
      <stop offset="100%" stop-color="#5E0F17" />
    </linearGradient>
    <linearGradient id="p2-red-facet-bot-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C1F2A" />
      <stop offset="100%" stop-color="#68121B" />
    </linearGradient>

    <!-- Green Side Walls -->
    <linearGradient id="p2-green-side" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FA12C" />
      <stop offset="100%" stop-color="#287319" />
    </linearGradient>

    <!-- Green Crash Pad Floor -->
    <linearGradient id="p2-green-mat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26663B" />
      <stop offset="50%" stop-color="#1E542F" />
      <stop offset="100%" stop-color="#153D22" />
    </linearGradient>

    <!-- Hold Colors -->
    <linearGradient id="p2-yellow-hold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD33" />
      <stop offset="100%" stop-color="#D9A800" />
    </linearGradient>
    <linearGradient id="p2-blue-hold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="p2-purple-hold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>

    <!-- Chalk Brush Filter -->
    <filter id="p2-chalk-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Frame Background -->
  <rect width="1600" height="800" fill="url(#p2-bg)" />

  <!-- TOP OVERHANG ROOF / BEAM -->
  <polygon points="0,0 1600,0 1600,240 1280,180 320,180 0,240" fill="#751C25" />
  <polygon points="0,0 1600,0 1600,60 0,60" fill="#991B24" />

  <!-- UPPER ROOF ANGLED SLOPES (Teal/Dark green panels) -->
  <!-- Upper Left Roof -->
  <polygon points="0,60 740,60 740,245 0,245" fill="url(#p2-teal-roof)" />
  <!-- Upper Right Roof -->
  <polygon points="740,60 1600,60 1600,245 740,245" fill="url(#p2-teal-roof)" />

  <!-- ================= MAIN GREY WALL BACKGROUND PANELS ================= -->
  <polygon points="140,245 1460,245 1400,730 200,730" fill="url(#p2-grey-panel)" />

  <!-- Left & Right Red Border Columns -->
  <polygon points="0,240 145,240 200,730 0,730" fill="#751C25" />
  <polygon points="1455,240 1600,240 1600,730 1400,730" fill="#751C25" />

  <!-- Green Side Triangles (Left & Right) -->
  <polygon points="145,245 360,245 200,730 145,730" fill="url(#p2-green-side)" />
  <polygon points="1240,245 1455,245 1455,730 1200,730" fill="url(#p2-green-side)" />

  <!-- Chalk Dusting on Background Panels -->
  <ellipse cx="800" cy="400" rx="300" ry="250" fill="#FFFFFF" opacity="0.14" filter="url(#p2-chalk-glow)" />
  <ellipse cx="480" cy="500" rx="140" ry="120" fill="#FFFFFF" opacity="0.10" filter="url(#p2-chalk-glow)" />
  <ellipse cx="1120" cy="500" rx="140" ry="120" fill="#FFFFFF" opacity="0.10" filter="url(#p2-chalk-glow)" />

  <!-- ================= THE GREAT DIAMOND (EL GRAN DIAMANTE) ================= -->
  <!-- Top Apex: (740, 10), Bottom Apex: (740, 640), Left Vertex: (500, 240), Right Vertex: (1030, 240), Center Meeting: (740, 290) -->

  <!-- Top-Left Diamond Facet 1 -->
  <polygon points="740,10 500,240 740,290" fill="url(#p2-red-facet-top-left)" stroke="#5E0F17" stroke-width="2" />
  <!-- Top-Right Diamond Facet 2 -->
  <polygon points="740,10 1030,240 740,290" fill="url(#p2-red-facet-top-right)" stroke="#5E0F17" stroke-width="2" />
  <!-- Middle-Left Diamond Facet 3 -->
  <polygon points="500,240 740,290 600,480" fill="url(#p2-red-facet-bot-left)" stroke="#5E0F17" stroke-width="2" />
  <!-- Middle-Right Diamond Facet 4 -->
  <polygon points="1030,240 740,290 880,480" fill="url(#p2-red-facet-bot-right)" stroke="#5E0F17" stroke-width="2" />
  <!-- Bottom-Left Diamond Facet 5 -->
  <polygon points="600,480 740,290 740,645" fill="url(#p2-red-facet-bot-left)" stroke="#5E0F17" stroke-width="2" />
  <!-- Bottom-Right Diamond Facet 6 -->
  <polygon points="880,480 740,290 740,645" fill="url(#p2-red-facet-bot-right)" stroke="#5E0F17" stroke-width="2" />

  <!-- Prominent Ridge Seams on the Diamond -->
  <line x1="740" y1="10" x2="740" y2="645" stroke="#FFA3AD" stroke-width="2" opacity="0.4" />
  <line x1="500" y1="240" x2="1030" y2="240" stroke="#FFA3AD" stroke-width="2" opacity="0.3" />

  <!-- Chalk Dust Over Diamond Center -->
  <ellipse cx="740" cy="300" rx="160" ry="180" fill="#FFFFFF" opacity="0.18" filter="url(#p2-chalk-glow)" />

  <!-- ================= 3D MOUNTED RED PYRAMID VOLUMES (LEFT SIDE) ================= -->
  <!-- Upper 3D Pyramid Volume on Left of Diamond -->
  <polygon points="400,260 530,295 440,415" fill="#B32B39" stroke="#5E0F17" stroke-width="2" />
  <polygon points="400,260 460,340 440,415" fill="#8C1723" />
  <!-- Lower 3D Pyramid Volume on Lower Left -->
  <polygon points="320,420 440,485 360,550" fill="#B32B39" stroke="#5E0F17" stroke-width="2" />
  <polygon points="320,420 380,490 360,550" fill="#75101A" />

  <!-- Bolt/T-Nut Hole Matrix Grid -->
  <g fill="#2A2F33" opacity="0.45">
    <circle cx="580" cy="200" r="3" /><circle cx="650" cy="200" r="3" /><circle cx="830" cy="200" r="3" /><circle cx="900" cy="200" r="3" />
    <circle cx="580" cy="280" r="3" /><circle cx="650" cy="280" r="3" /><circle cx="830" cy="280" r="3" /><circle cx="900" cy="280" r="3" />
    <circle cx="650" cy="360" r="3" /><circle cx="720" cy="360" r="3" /><circle cx="760" cy="360" r="3" /><circle cx="830" cy="360" r="3" />
    <circle cx="650" cy="440" r="3" /><circle cx="720" cy="440" r="3" /><circle cx="760" cy="440" r="3" /><circle cx="830" cy="440" r="3" />
    <circle cx="680" cy="520" r="3" /><circle cx="740" cy="520" r="3" /><circle cx="800" cy="520" r="3" />
    <circle cx="940" cy="360" r="3" /><circle cx="1020" cy="360" r="3" /><circle cx="1100" cy="360" r="3" /><circle cx="1180" cy="360" r="3" />
    <circle cx="940" cy="440" r="3" /><circle cx="1020" cy="440" r="3" /><circle cx="1100" cy="440" r="3" /><circle cx="1180" cy="440" r="3" />
    <circle cx="940" cy="520" r="3" /><circle cx="1020" cy="520" r="3" /><circle cx="1100" cy="520" r="3" /><circle cx="1180" cy="520" r="3" />
  </g>

  <!-- ================= TOP BEAM HOLDS ================= -->
  <ellipse cx="40" cy="90" rx="42" ry="24" fill="url(#p2-yellow-hold)" />
  <circle cx="180" cy="85" r="18" fill="url(#p2-blue-hold)" />
  <circle cx="250" cy="180" r="22" fill="url(#p2-yellow-hold)" />
  <path d="M 460,35 Q 510,25 510,70 Q 470,80 460,35 Z" fill="url(#p2-yellow-hold)" />
  <circle cx="740" cy="90" r="20" fill="url(#p2-blue-hold)" />
  <path d="M 1030,30 Q 1070,25 1070,65 Q 1035,75 1030,30 Z" fill="#F0F8FF" />
  <ellipse cx="1120" cy="45" rx="16" ry="20" fill="url(#p2-yellow-hold)" />
  <ellipse cx="1270" cy="70" rx="35" ry="22" fill="url(#p2-blue-hold)" />
  <path d="M 1320,20 Q 1370,15 1375,70 Q 1330,80 1320,20 Z" fill="url(#p2-yellow-hold)" />
  <ellipse cx="1510" cy="65" rx="40" ry="24" fill="url(#p2-yellow-hold)" />

  <!-- ================= CLIMBING HOLDS ON DIAMOND & SIDE PANELS ================= -->
  <!-- Inside the Diamond holds -->
  <circle cx="690" cy="85" r="14" fill="#F0F8FF" />
  <circle cx="800" cy="180" r="16" fill="url(#p2-yellow-hold)" />
  <ellipse cx="750" cy="245" rx="14" ry="10" fill="#F0F8FF" />
  <ellipse cx="840" cy="235" rx="16" ry="12" fill="url(#p2-yellow-hold)" />
  <circle cx="600" cy="300" r="14" fill="url(#p2-yellow-hold)" />
  <circle cx="680" cy="310" r="14" fill="url(#p2-yellow-hold)" />
  <circle cx="770" cy="305" r="15" fill="url(#p2-yellow-hold)" />
  <circle cx="850" cy="310" r="14" fill="url(#p2-yellow-hold)" />
  <circle cx="630" cy="370" r="15" fill="url(#p2-yellow-hold)" />
  <circle cx="710" cy="365" r="14" fill="url(#p2-yellow-hold)" />
  <circle cx="820" cy="420" r="15" fill="url(#p2-yellow-hold)" />
  <circle cx="700" cy="445" r="15" fill="url(#p2-yellow-hold)" />
  <circle cx="770" cy="440" r="14" fill="#F0F8FF" />
  <ellipse cx="775" cy="525" rx="18" ry="12" fill="url(#p2-yellow-hold)" />
  <circle cx="700" cy="530" r="14" fill="#F0F8FF" />

  <!-- Holds on Right Grey / Green Panels -->
  <circle cx="1090" cy="245" r="16" fill="url(#p2-yellow-hold)" />
  <circle cx="1135" cy="360" r="18" fill="url(#p2-yellow-hold)" />
  <circle cx="950" cy="495" r="16" fill="url(#p2-yellow-hold)" />
  <ellipse cx="1070" cy="500" rx="16" ry="12" fill="url(#p2-yellow-hold)" />
  <circle cx="900" cy="570" r="15" fill="#3D454A" />
  <circle cx="1010" cy="575" r="14" fill="#3D454A" />
  <circle cx="1140" cy="575" r="15" fill="#3D454A" />
  <circle cx="1275" cy="670" r="18" fill="url(#p2-blue-hold)" />

  <!-- Holds on Left Panels -->
  <circle cx="360" cy="290" r="14" fill="url(#p2-yellow-hold)" />
  <ellipse cx="230" cy="370" rx="18" ry="14" fill="url(#p2-yellow-hold)" />
  <circle cx="530" cy="565" r="15" fill="url(#p2-blue-hold)" />
  <circle cx="610" cy="625" r="14" fill="url(#p2-yellow-hold)" />

  <!-- Center Floor Chalk Line -->
  <line x1="740" y1="645" x2="740" y2="730" stroke="#FFFFFF" stroke-width="8" opacity="0.3" />

  <!-- ================= GREEN CRASH PAD FLOOR ================= -->
  <polygon points="0,730 1600,730 1600,800 0,800" fill="url(#p2-green-mat)" stroke="#11331B" stroke-width="4" />
  <line x1="0" y1="740" x2="1600" y2="740" stroke="#3DA35A" stroke-width="3" opacity="0.6" />
</svg>
